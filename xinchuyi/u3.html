<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词消消乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fffacd, #f0e68c);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .title {
            font-size: 2.5rem;
            color: #ff6b35;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .game-container {
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: 40px 0;
            padding: 20px;
            align-items: center;
        }

        .en-bubble {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            user-select: none;
        }

        .option-wrap {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        .bubble {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            position: relative;
            user-select: none;
        }

        .bubble:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        /* 爆炸动画 */
        @keyframes boom {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.6; background: red; }
            100% { transform: scale(0); opacity: 0; }
        }
        .boom {
            animation: boom 0.5s forwards;
        }

        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .success-content {
            background: linear-gradient(135deg, #fffacd, #f0e68c);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 3px solid #ff6b35;
            max-width: 90%;
            width: 400px;
        }

        .success-title {
            font-size: 2rem;
            color: #ff6b35;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .continue-btn {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        /* 答错gif弹窗 */
        /* 答错GIF弹窗 修复版 */
.error-gif {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    z-index: 10000; /* 最高层级 */
    display: none;
    pointer-events: none;
}
    </style>
</head>
<body>
    <h1 class="title">🎮 单词消消乐 🎮</h1>
    <div class="game-info">
        <div>⏰ 用时: <span id="timer">00:00</span></div>
        <div>🎯 剩余: <span id="progress">0</span></div>
    </div>

    <div class="game-container">
        <div class="en-bubble" id="enWord"></div>
        <div class="option-wrap" id="optionBox"></div>
    </div>

    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-title">🎉 全部通关！</div>
            <button class="continue-btn" onclick="resetAll()">重新开始</button>
        </div>
    </div>

    <audio id="bgMusic" src="jcldxt.mp3" loop />
    <audio id="boomSound" src="error.m4a" />
    <audio id="winSound" src="end.m4a" />
    <audio id="okSound" src="ok.mp3" />
    <audio id="ok1" src="ok1.m4a" />
    <audio id="ok2" src="ok2.m4a" />
    <audio id="ok3" src="ok3.m4a" />

    <img class="error-gif" id="errorGif" src="" />

    <script>
        // 单词直接写这里，不用外部json，双击可直接打开
const allWords = [
{"en":"footprint","zh":"脚步，足迹","err":"声音"},
{"en":"wet","zh":"潮湿的","err":"干燥的"},
{"en":"deep","zh":"深的","err":"浅的"},
{"en":"sandy","zh":"铺满沙子的，含沙的","err":"多石的"},
{"en":"kick","zh":"踹，踢","err":"抚摸"},
{"en":"town","zh":"镇，市镇","err":"首都"},
{"en":"feature","zh":"特色，特征","err":"缺点"},
{"en":"south","zh":"南方","err":"北方"},
{"en":"clear","zh":"晴朗的","err":"阴沉的"},
{"en":"loudly","zh":"喧闹地，响亮地","err":"安静地"},
{"en":"thunder","zh":"雷","err":"彩虹"},
{"en":"lighting","zh":"闪电","err":"晚霞"},
{"en":"fresh","zh":"新鲜的","err":"腐烂的"},
{"en":"gather","zh":"采集（植物，水果）等","err":"丢弃"},
{"en":"peaceful","zh":"安静的，平静的","err":"喧闹的"},
{"en":"snake","zh":"蛇","err":"兔子"},
{"en":"through","zh":"自始至终，从头到尾","err":"在...之外"},
{"en":"part","zh":"区域，地区","err":"整体"},
{"en":"article","zh":"文章","err":"乐曲"},
{"en":"reason","zh":"理由，原因","err":"结果"},
{"en":"alive","zh":"有生气，有活力","err":"死气沉沉"},
{"en":"sandcastle","zh":"沙堡","err":"木屋"},
{"en":"follow","zh":"按...方式发展","err":"违背"},
{"en":"divide","zh":"使分开","err":"合并"},
{"en":"decide","zh":"对...做出抉择，决定","err":"犹豫不定"},
{"en":"crop","zh":"庄稼，作物","err":"矿石"},
{"en":"culture","zh":"文明，文化","err":"野蛮"},
{"en":"local","zh":"当地的，地方的","err":"国外的"},
{"en":"tradition","zh":"传统","err":"新潮"},
{"en":"continue","zh":"持续，继续存在","err":"终止"},
{"en":"have picnics","zh":"去野餐","err":"参加晚宴"},
{"en":"work one's land","zh":"耕种土地","err":"建造房屋"},
{"en":"take a trip","zh":"去旅行","err":"居家休息"},
{"en":"solar term","zh":"节气","err":"节日"},
{"en":"in fact","zh":"事实上","err":"表面上"},
{"en":"be divided into","zh":"被划分成...","err":"合并为"},
{"en":"be based on","zh":"基于...","err":"脱离于"},
{"en":"play an important part in","zh":"在...上发挥重要作用","err":"不起作用"}
];

        let passedWords = [];
        let gameWords = [];
        let currentWord = null;
        let startTime;
        let timerInterval;
        let successCount = 0; // 累计答对次数
        let audioIndex = 0;    // 顺序索引 0=ok1,1=ok2,2=ok3
        let gifIndex = 0; // 控制error1/2/3顺序

        function initGame() {
            // 读取已通关（浏览器本地存储，替代 passed.json）
            passedWords = JSON.parse(localStorage.getItem("passed") || "[]");
            gameWords = allWords.filter(w => !passedWords.includes(w.en));
            startGame();
        }

        function startGame() {
            updateInfo();
            nextWord();
            startTimer();
        }

        function nextWord() {
            if(gameWords.length === 0) {
                gameComplete();
                return;
            }
            const i = Math.floor(Math.random() * gameWords.length);
            currentWord = gameWords[i];
            showWord();
        }

        function showWord() {
            document.getElementById("enWord").textContent = currentWord.en;
            const opts = [
                {txt:currentWord.zh, right:true},
                {txt:currentWord.err, right:false}
            ].sort(()=>Math.random()-0.5);

            const box = document.getElementById("optionBox");
            box.innerHTML = "";
            opts.forEach(o => {
                const d = document.createElement("div");
                d.className = "bubble";
                d.style.background = getColor();
                d.textContent = o.txt;
                d.onclick = () => choose(o.right, d);
                box.appendChild(d);
            });
        }

        function choose(isRight, dom) {
            if(isRight) {
	successCount++;
                 // 每3次随机播放ok1/ok2/ok3
                 if (successCount % 3 === 0) {
                     // 每3次按顺序播放
            	    const list = ["ok1","ok2","ok3"];
            	    const audio = document.getElementById(list[audioIndex]);
            	    audio.currentTime = 0;
            	    audio.play().catch(()=>{});
            	    // 索引循环
            	    audioIndex = (audioIndex + 1) % 3;
                 } else {
                     // 普通答对音效
                     const okAudio = document.getElementById("okSound");
                     okAudio.currentTime = 0;
                     okAudio.play().catch(()=>{});
                 }

                // 答对：保存，移除题库
                passedWords.push(currentWord.en);
                localStorage.setItem("passed", JSON.stringify(passedWords));
                gameWords = gameWords.filter(w => w.en !== currentWord.en);
                setTimeout(nextWord, 400);
            } else {
                // 答错：动态创建GIF弹窗，强制居中、最高层级
        	const gifList = ["error1.gif","error2.gif","error3.gif"];

        	// 移除旧的
        	let oldGif = document.getElementById("tempErrorGif");
        	if(oldGif) oldGif.remove();

        	// 新建
        	let div = document.createElement("div");
        	div.id = "tempErrorGif";
        	div.style.cssText = `
           	 	position:fixed;
            		top:50%;left:50%;
            		transform:translate(-50%,-50%);
            		z-index:999999;
            		width:220px;height:220px;
            		background:url(${gifList[gifIndex]}) center/cover no-repeat;
        	`;
        	document.body.appendChild(div);

       	 // 循环索引
        	gifIndex = (gifIndex + 1) % 3;

       	 // 1.5秒后消失
        	setTimeout(()=>{
            		div.remove();
        	}, 1500);

                // 答错：爆炸动画+音效，题目保留
                dom.classList.add("boom");
	document.getElementById("boomSound").currentTime = 0; // 重置到开头
                document.getElementById("boomSound").play().catch(()=>{});
                setTimeout(() => {
                    dom.classList.remove("boom");
                    nextWord();
                }, 1500);
            }
            updateInfo();
        }

        function getColor() {
            const cs = ['#4ecdc4','#45b7d1','#f093fb','#4facfe','#43e97b','#fa709a'];
            return cs[Math.floor(Math.random()*cs.length)];
        }

        function updateInfo() {
            document.getElementById("progress").textContent = gameWords.length;
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const s = Math.floor((Date.now()-startTime)/1000);
                document.getElementById("timer").textContent = 
                    String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0');
            },1000);
        }

        function gameComplete() {
            clearInterval(timerInterval);
            // 播放通关音效
            document.getElementById("winSound").play().catch(()=>{});
            document.getElementById("successModal").style.display = "flex";
        }

        function resetAll() {
            localStorage.removeItem("passed");
            location.reload();
        }

        window.onload = () => {
            initGame();
            // 背景音乐自动播放兼容
            const bg = document.getElementById("bgMusic");
            //bg.play().catch(()=>{
             //   document.body.onclick = ()=>bg.play();
            //});
        };
    </script>
</body>
</html>
