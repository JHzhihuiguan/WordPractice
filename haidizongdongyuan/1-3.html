function renderProgressBar() {
  const layer = document.getElementById("growthLayer");
  if (!layer) return;
  const cfg = THEME_PROGRESS_CFG;
  const pct = Math.max(0, Math.min(100, Math.round((gameState.growthLevel / gameState.growthMax) * 100)));
  let emoji = cfg.stages[cfg.stages.length - 1].emoji;
  for (let i = 0; i < cfg.stages.length; i++) { if (pct >= cfg.stages[i].min && pct <= cfg.stages[i].max) { emoji = cfg.stages[i].emoji; break; } }
  layer.style.setProperty("--track-color", cfg.trackColor);
  layer.style.setProperty("--fill-gradient", cfg.fillGradient);
  layer.className = "theme-progress-bar tpb-effect-" + cfg.effect;
  layer.dataset.theme = THEME_KEY;
  layer.dataset.percent = String(pct);
  if (THEME_KEY === "ink") {
    if (pct <= 30) layer.dataset.stage = "brush";
    else if (pct <= 70) layer.dataset.stage = "scroll";
    else if (pct <= 99) layer.dataset.stage = "mountain";
    else layer.dataset.stage = "dragon";
  } else { delete layer.dataset.stage; }
  layer.innerHTML = '<div class="tpb-track"><div class="tpb-fill" style="width:' + pct + '%"></div><div class="tpb-emoji" style="left:' + pct + '%">' + emoji + '</div></div><div class="tpb-label">' + cfg.name + ' · ' + pct + '%</div>';
}

let sfxCtx = null;
let bgmGain = null;
let bgmTimer = null;
function getSfxCtx() {
  try {
    if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sfxCtx.state === "suspended") sfxCtx.resume();
    return sfxCtx;
  } catch(e) { return null; }
}
function playTone(freq, duration, type, volume) {
  if (!gameState.soundOn) return;
  const ctx = getSfxCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const t0 = ctx.currentTime;
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume || 0.2, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  } catch(e) {}
}
function startBgm() {
  if (!gameState.bgmOn) return;
  if (!BGM_NOTES || !BGM_NOTES.length) return;
  stopBgm();
  const ctx = getSfxCtx();
  if (!ctx) return;
  bgmGain = ctx.createGain();
  bgmGain.gain.value = gameState.bgmVolume * 0.3;
  bgmGain.connect(ctx.destination);
  let idx = 0;
  const playNext = () => {
    if (!gameState.bgmOn || !bgmGain) return;
    const note = BGM_NOTES[idx % BGM_NOTES.length];
    const freq = note[0];
    const dur = note[1] * (60 / BGM_TEMPO) * 2;
    try {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.connect(g);
      g.connect(bgmGain);
      osc.start();
      osc.stop(ctx.currentTime + dur + 0.05);
    } catch(e) {}
    idx++;
    bgmTimer = setTimeout(playNext, dur * 1000);
  };
  playNext();
}
function stopBgm() {
  if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
  if (bgmGain) { try { bgmGain.disconnect(); } catch(e) {} bgmGain = null; }
}
function setBgmVolume(v) {
  gameState.bgmVolume = v;
  if (bgmGain) bgmGain.gain.value = v * 0.3;
}

function initCharacter() {
  const stageW = gameStage.clientWidth;
  const stageH = gameStage.clientHeight;
  const cw = character.offsetWidth;
  const ch = character.offsetHeight;
  charBaseY = stageH - ch - 30;
  if (CHARACTER_START === "left") charX = 30;
  else if (CHARACTER_START === "right") charX = stageW - cw - 30;
  else if (CHARACTER_START === "random") charX = Math.random() * (stageW - cw);
  else charX = (stageW - cw) / 2;
  charY = charBaseY;
  charVY = (Math.random() - 0.5) * 4;
  character.style.left = charX + "px";
  character.style.top = charY + "px";
  pathPoints = [
    { x: 50, y: stageH - ch - 50 },
    { x: stageW - cw - 50, y: stageH - ch - 50 },
    { x: stageW - cw - 50, y: 180 },
    { x: 50, y: 180 }
  ];
  pathIdx = 0;
}

function updateCharacter() {
  const stageW = gameStage.clientWidth;
  const stageH = gameStage.clientHeight;
  const cw = character.offsetWidth;
  const ch = character.offsetHeight;
  charBaseY = stageH - ch - 30;
  if (INTERACTION_MODE === "catch") {
    const targetX = mouseX - cw / 2;
    charX += (targetX - charX) * 0.25;
    if (charX < 0) charX = 0;
    if (charX > stageW - cw) charX = stageW - cw;
    charY = charBaseY;
  } else if (INTERACTION_MODE === "mouseFollow") {
    const targetX = mouseX - cw / 2;
    charX += (targetX - charX) * 0.3;
    if (charX < 0) charX = 0;
    if (charX > stageW - cw) charX = stageW - cw;
    charJumpV += 0.6;
    charY += charJumpV;
    if (charY >= charBaseY) { charY = charBaseY; charJumpV = 0; }
  } else if (CHARACTER_TRACK === "followMouse") {
    const targetX = mouseX - cw / 2;
    const targetY = mouseY - ch / 2;
    charX += (targetX - charX) * 0.12;
    charY += (targetY - charY) * 0.12;
  } else if (CHARACTER_TRACK === "leftRight") {
    charX += charDir * 2.4;
    if (charX < 10) { charX = 10; charDir = 1; }
    if (charX > stageW - cw - 10) { charX = stageW - cw - 10; charDir = -1; }
    charY = charBaseY;
  } else if (CHARACTER_TRACK === "leftRightJump") {
    charX += charDir * 2.6;
    if (charX < 10) { charX = 10; charDir = 1; charJumpV = -10; }
    if (charX > stageW - cw - 10) { charX = stageW - cw - 10; charDir = -1; charJumpV = -10; }
    charJumpV += 0.5;
    charY += charJumpV;
    if (charY >= charBaseY) { charY = charBaseY; if (Math.random() < 0.02) charJumpV = -10; }
  } else if (CHARACTER_TRACK === "standbyDash") {
    const targetX = mouseX - cw / 2;
    const dx = targetX - charX;
    if (Math.abs(dx) > 5) charX += dx * 0.25;
    charY = charBaseY;
  } else if (CHARACTER_TRACK === "cruise") {
    charX += charDir * 1.5;
    if (charX < 10) { charX = 10; charDir = 1; }
    if (charX > stageW - cw - 10) { charX = stageW - cw - 10; charDir = -1; }
    charY = charBaseY;
  } else if (CHARACTER_TRACK === "wave") {
    charWaveT += 0.04;
    charX += charDir * 1.8;
    if (charX < 10) { charX = 10; charDir = 1; }
    if (charX > stageW - cw - 10) { charX = stageW - cw - 10; charDir = -1; }
    charY = charBaseY - Math.sin(charWaveT) * 40;
  } else if (CHARACTER_TRACK === "clickApproach") {
    charY = charBaseY;
  } else if (CHARACTER_TRACK === "pathPoints") {
    const target = pathPoints[pathIdx];
    const dx = target.x - charX;
    const dy = target.y - charY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 8) {
      pathIdx = (pathIdx + 1) % pathPoints.length;
    } else {
      charX += (dx / dist) * 2.2;
      charY += (dy / dist) * 2.2;
      charDir = dx > 0 ? 1 : -1;
    }
  } else if (CHARACTER_TRACK === "physicsBounce") {
    charX += charDir * 2.5;
    charY += charVY;
    if (charX < 10) { charX = 10; charDir = 1; }
    if (charX > stageW - cw - 10) { charX = stageW - cw - 10; charDir = -1; }
    if (charY < 130) { charY = 130; charVY = -charVY; }
    if (charY > charBaseY) { charY = charBaseY; charVY = -Math.abs(charVY) - 0.5; }
  }
  character.style.left = charX + "px";
  character.style.top = charY + "px";
  character.style.transform = "scaleX(" + (charDir > 0 ? 1 : -1) + ")";
}

function spawnWord(text, isCorrect, idx, total) {
  const stageW = gameStage.clientWidth;
  const stageH = gameStage.clientHeight;
  const speedCfg = SPEED_MAP[SPEED] || SPEED_MAP.normal;
  const el = document.createElement("div");
  el.className = "flying-word";
  el.textContent = text;
  wordsLayer.appendChild(el);
  const rect = el.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  let x, y, vx, vy;
  let mode = ENTRY_MODE;
  if (INTERACTION_MODE === "catch") mode = "top";
  if (INTERACTION_MODE === "connect") mode = "connect";
  if (mode === "mixed") {
    const opts = ["left","right","top","bottom","groundUp","growDown"];
    mode = opts[Math.floor(Math.random() * opts.length)];
  }
  const baseV = speedCfg.base + Math.random() * 0.6;
  const safeTop = 130;
  const safeBottom = 160;
  const usableH = Math.max(60, stageH - safeTop - safeBottom);
  if (mode === "connect") {
    const rowGap = Math.max(78, h + 26);
    const row = Math.floor(idx / 2);
    const isLeftCol = idx % 2 === 0;
    x = isLeftCol ? 80 : Math.max(80, stageW - w - 80);
    y = safeTop + 90 + row * rowGap;
    if (y > stageH - safeBottom - h) y = safeTop + 40 + (idx * 24) % Math.max(80, usableH - h);
    vx = 0; vy = 0;
    el.dataset.willStopXY = "0";
  } else if (mode === "left") {
    x = -w - 20;
    y = safeTop + Math.random() * (usableH - h);
    vx = baseV; vy = 0;
  } else if (mode === "right") {
    x = stageW + 20;
    y = safeTop + Math.random() * (usableH - h);
    vx = -baseV; vy = 0;
  } else if (mode === "top") {
    x = 20 + Math.random() * (stageW - w - 40);
    y = -h - 20;
    vx = 0; vy = baseV;
  } else if (mode === "bottom") {
    x = 20 + Math.random() * (stageW - w - 40);
    y = stageH + 20;
    vx = 0; vy = -baseV;
  } else if (mode === "toss") {
    x = 40 + Math.random() * (stageW - w - 80);
    y = stageH + 30;
    vx = (Math.random() - 0.5) * 1.2;
    const gToss = 0.055;
    const riseDist = (stageH + 30) - 60;
    const vy0 = Math.sqrt(2 * gToss * riseDist);
    vy = -(vy0 + 0.3 + Math.random() * 0.4);
  } else if (mode === "groundUp") {
    // 横向均分区间，每个单词分配独立X段，错开不重叠
    const colCount = total;
    const padding = 30;
    const areaW = stageW - padding * 2;
    const cellW = areaW / colCount;
    // 当前单词所属格子范围
    const cellStart = padding + idx * cellW;
    const cellEnd = cellStart + cellW - w;
    // 在自己格子内随机横坐标
    x = cellStart + Math.random() * Math.max(0, cellEnd - cellStart);
    y = stageH + 20;
    vx = 0;
    vy = -baseV * 0.8;
    el.dataset.targetY = (safeTop + Math.random() * usableH);
    el.dataset.willStop = "1";
  } else if (mode === "growDown") {
    // 和groundUp相同横向分栏逻辑
    const colCount = total;
    const padding = 30;
    const areaW = stageW - padding * 2;
    const cellW = areaW / colCount;
    const cellStart = padding + idx * cellW;
    const cellEnd = cellStart + cellW - w;
    x = cellStart + Math.random() * Math.max(0, cellEnd - cellStart);
    y = -h - 20;
    vx = 0;
    vy = baseV * 0.8;
    el.dataset.targetY = (safeTop + Math.random() * usableH);
    el.dataset.willStop = "1";
  } else if (mode === "lineByLine") {
    const lineY = safeTop + 40 + idx * (h + 20);
    x = -w - 20;
    y = lineY;
    vx = baseV * 1.5;
    vy = 0;
    el.dataset.targetX = (stageW - w) / 2;
    el.dataset.willStopX = "1";
  } else if (mode === "scatter") {
    x = Math.random() * (stageW - w);
    y = Math.random() * (stageH - h - 200) + safeTop;
    const cx = (stageW - w) / 2;
    const cy = (stageH - h) / 2;
    const colCount = Math.max(2, OPTION_COUNT);
    const angle = (idx / colCount) * Math.PI * 2;
    el.dataset.targetX = cx + Math.cos(angle) * 200;
    el.dataset.targetY = cy + Math.sin(angle) * 120;
    el.dataset.willStopXY = "1";
    vx = 0; vy = 0;
  } else if (mode === "followChar") {
    const cw2 = character.offsetWidth;
    x = charX + cw2 / 2 - w / 2 + (Math.random() - 0.5) * 80;
    y = charY - h - 20 - idx * (h + 8);
    if (y < safeTop) y = safeTop;
    vx = 0; vy = 0;
    el.dataset.followChar = "1";
    el.dataset.offsetIdx = idx;
  } else {
    x = stageW + 20;
    y = safeTop + Math.random() * (usableH - h);
    vx = -baseV; vy = 0;
  }
  el.style.left = x + "px";
  el.style.top = y + "px";
  const word = {
    el, text, isCorrect,
    x, y, vx, vy, w, h,
    sliced: false,
    bornAt: performance.now(),
    mode: mode,
    offsetIdx: idx
  };
  el.addEventListener("pointerdown", (e) => {
    if (INTERACTION_MODE === "click") {
      e.preventDefault();
      e.stopPropagation();
      handlePick(word);
      return;
    }
  });
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    if (INTERACTION_MODE === "click" || INTERACTION_MODE === "follow" || INTERACTION_MODE === "collide" || INTERACTION_MODE === "swipe" || INTERACTION_MODE === "catch") {
      handlePick(word);
    } else if (INTERACTION_MODE === "shoot") {
      shootAt(word.x + word.w/2, word.y + word.h/2);
    }
  });
  el.addEventListener("touchstart", (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (INTERACTION_MODE === "click") handlePick(word);
  }, { passive: false });
  if (INTERACTION_MODE === "drag") setupDragWord(word);
  if (INTERACTION_MODE === "connect") setupConnectWord(word);
  return word;
}

function loadQuestion() {
  const q = QUESTIONS[gameState.current];
  if (!q) { endGame(); return; }
  gameState.answered = false;
  gameState.flyingWords.forEach(w => { try { w.el.remove(); } catch(e) {} });
  gameState.flyingWords = [];
  stemText.textContent = q.stem;
  qNumEl.textContent = gameState.current + 1;
  const distractorTotal = Math.max(1, OPTION_COUNT - 1);
  const pool = (ALL_WORDS || []).filter(w => w && w.toLowerCase() !== String(q.correct).toLowerCase());
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  const distractors = [];
  if (q.distractor && /^[A-Za-z]/.test(q.distractor)) distractors.push(q.distractor);
  for (const w of shuffled) {
    if (distractors.length >= distractorTotal) break;
    if (!distractors.some(d => d.toLowerCase() === w.toLowerCase())) distractors.push(w);
  }
  while (distractors.length < distractorTotal) distractors.push("option" + distractors.length);
  const all = [{ text: q.correct, isCorrect: true }];
  for (let i = 0; i < distractorTotal; i++) all.push({ text: distractors[i], isCorrect: false });
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = all[i]; all[i] = all[j]; all[j] = t;
  }
  all.forEach((item, idx) => {
    setTimeout(() => {
      if (gameState.current >= QUESTIONS.length) return;
      gameState.flyingWords.push(spawnWord(item.text, item.isCorrect, idx, all.length));
    }, 200 + idx * 320);
  });
}

      p.style.background = colors[i % colors.length];
      p.style.left = (word.x + word.w/2) + "px";
      p.style.top = (word.y + word.h/2) + "px";

      const ang = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 120;
      p.animate([
        { transform: "translate(0,0) rotate(0)", opacity: 1 },
        { transform: "translate(" + Math.cos(ang)*dist + "px," + (Math.sin(ang)*dist + 100) + "px) rotate(" + (Math.random()*720) + "deg)", opacity: 0 }
      ], { duration: 1500, easing: "ease-out" });
      setTimeout(() => { try { p.remove(); } catch(e) {} }, 1500);
    }
  } else if (SUCCESS_FX === "coin") {
    playTone(880, 0.06, "square", 0.18);
    for (let i = 0; i < 10; i++) {
      const c = document.createElement("div");
      c.className = "coin-piece";
      c.textContent = "🪙";

      c.style.top = (word.y) + "px";
      gameStage.appendChild(c);
      c.animate([
        { transform: "translateY(0) rotate(0)", opacity: 1 },
        { transform: "translateY(" + (300 + Math.random() * 100) + "px) rotate(720deg)", opacity: 0 }
      ], { duration: 1200, easing: "ease-in" });
      setTimeout(() => { try { c.remove(); } catch(e) {} }, 1200);
    }
  } else if (SUCCESS_FX === "cheer") {
    if (CHARACTER_EMOTE === "on") {
      character.classList.add("cheer");
      setTimeout(() => character.classList.remove("cheer"), 600);
    }
    spawnScorePop("🎉 棒!", word.x + word.w/2, word.y, "#28a96b");
  }
  if (CHARACTER_EMOTE === "on" && SUCCESS_FX !== "cheer") {
    character.classList.add("cheer");
    setTimeout(() => character.classList.remove("cheer"), 600);
  }
}

function applyErrorFx(word) {
  if (ERROR_FX === "shake") {
    word.el.classList.add("error-shake");
    gameStage.animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}], 300);
  } else if (ERROR_FX === "red") {
    word.el.classList.add("error-red");
  } else if (ERROR_FX === "back") {
    word.el.animate([{transform:"scale(1)"},{transform:"scale(.7)"},{transform:"scale(1)"}], 300);
  } else if (ERROR_FX === "gray") {
    grayOverlay.classList.add("show");
    setTimeout(() => grayOverlay.classList.remove("show"), 500);
  } else if (ERROR_FX === "faint") {
    if (CHARACTER_EMOTE === "on") {
      character.classList.add("faint");
      setTimeout(() => character.classList.remove("faint"), 800);
    }
  } else if (ERROR_FX === "regret") {
    playTone(220, 0.2, "sine", 0.15);
    setTimeout(() => playTone(180, 0.3, "sine", 0.12), 150);
  }
  if (CHARACTER_EMOTE === "on" && ERROR_FX !== "faint") {
    character.classList.add("sad");
    setTimeout(() => character.classList.remove("sad"), 600);
  }
}

function handlePick(word) {
  if (word.sliced || gameState.answered) return;
  word.sliced = true;
  const sliceAngle = (typeof word._sliceAngle === "number") ? word._sliceAngle : 0;
  if (word.isCorrect) {
    playTone(880, 0.08, "square", 0.18);
    setTimeout(() => playTone(1318, 0.12, "square", 0.18), 80);
    gameState.correctCount++;
    gameState.score += 10;
    updateScore();
    GROWTH_API.update(true);
    if (INTERACTION_MODE === "swipe") {
      spawnSliceFlash(word.x + word.w/2, word.y + word.h/2, true);
      spawnSliceHalves(word, sliceAngle);
      try { word.el.style.display = "none"; } catch(e) {}
    }
    applySuccessFx(word);
    spawnScorePop("+10", word.x + word.w/2, word.y + word.h/2, "#28a96b");
    showFeedback("✅ 正确！" + word.text, true);
    setTimeout(() => { try { word.el.remove(); } catch(e) {} }, 500);
    gameState.flyingWords = gameState.flyingWords.filter(w => w !== word);
    handleAnswerEnd(true);
  } else {
    playTone(180, 0.2, "sawtooth", 0.18);
    gameState.score = Math.max(0, gameState.score - 5);
    gameState.wrongCount++;
    updateScore();
    GROWTH_API.update(false);
    if (INTERACTION_MODE === "swipe") {
      spawnSliceFlash(word.x + word.w/2, word.y + word.h/2, false);
      spawnSliceHalves(word, sliceAngle);
      try { word.el.style.display = "none"; } catch(e) {}
      setTimeout(() => { try { word.el.remove(); } catch(e) {} }, 500);
      gameState.flyingWords = gameState.flyingWords.filter(w => w !== word);
    } else {
      setTimeout(() => {
        word.sliced = false;
        word.el.classList.remove("error-shake","error-red");
      }, 600);
    }
    applyErrorFx(word);
    spawnScorePop("-5", word.x + word.w/2, word.y + word.h/2, "#ef4e32");
    showFeedback("❌ 不对哦", false);
  }
}

function handleAnswerEnd(correct) {
  if (gameState.answered) return;
  gameState.answered = true;
  const q = QUESTIONS[gameState.current];
  gameState.results.push({ stem: q.stem, correct: q.correct, isCorrect: correct });
  setTimeout(() => {
    gameState.flyingWords.forEach(w => { try { w.el.remove(); } catch(e) {} });
    gameState.flyingWords = [];
    feedbackEl.classList.remove("show");
    gameState.current++;
    if (gameState.current >= QUESTIONS.length) endGame();
    else loadQuestion();
  }, 1200);
}

function spawnScorePop(text, x, y, color) {
  const pop = document.createElement("div");
  pop.className = "score-pop";
  pop.textContent = text;
  pop.style.left = (x - 30) + "px";
  pop.style.top = (y - 20) + "px";
  pop.style.color = color || "#28a96b";
  gameStage.appendChild(pop);
  setTimeout(() => { try { pop.remove(); } catch(e) {} }, 1300);
}

function updateScore() {
  scoreValEl.textContent = gameState.score;
  const total = gameState.correctCount + gameState.wrongCount;
  const acc = total > 0 ? Math.round((gameState.correctCount / Math.max(QUESTIONS.length, total)) * 100) : 0;
  accValEl.textContent = acc + "%";
}

function showFeedback(msg, isCorrect) {
  feedbackEl.textContent = msg;
  feedbackEl.style.background = isCorrect ? "linear-gradient(135deg,#28a96b,#08a6cf)" : "linear-gradient(135deg,#ef4e32,#dc2626)";
  feedbackEl.classList.add("show");
}

function checkCharacterCollision() {
  if (INTERACTION_MODE !== "collide" && INTERACTION_MODE !== "follow" && INTERACTION_MODE !== "catch") return;
  const cw = character.offsetWidth;
  const ch = character.offsetHeight;
  const cx = charX + cw/2;
  const cy = charY + ch/2;
  for (const w of gameState.flyingWords.slice()) {
    if (w.sliced) continue;
    const wx = w.x + w.w/2;
    const wy = w.y + w.h/2;
    const dx = cx - wx;
    const dy = cy - wy;
    const threshold = INTERACTION_MODE === "follow" ? 50 : 40;
    if (Math.sqrt(dx*dx + dy*dy) < threshold + Math.min(cw,ch)/3) {
      handlePick(w);
      break;
    }
  }
}

function gameLoop() {
  const stageW = gameStage.clientWidth;
  const stageH = gameStage.clientHeight;
  const now = performance.now();
  const speedCfg = SPEED_MAP[SPEED] || SPEED_MAP.normal;
  gameState.flyingWords = gameState.flyingWords.filter(w => {
    if (w.sliced && !w.el.parentNode) return false;
    if (w.sliced) return true;
    if (w.el.dataset.willStop === "1") {
      const targetY = parseFloat(w.el.dataset.targetY);
      w.y += w.vy;
      if ((w.vy < 0 && w.y <= targetY) || (w.vy > 0 && w.y >= targetY)) {
        w.y = targetY; w.vy = 0; w.el.dataset.willStop = "0";
      }
    } else if (w.el.dataset.willStopX === "1") {
      const targetX = parseFloat(w.el.dataset.targetX);
      w.x += w.vx;
      if ((w.vx > 0 && w.x >= targetX) || (w.vx < 0 && w.x <= targetX)) {
        w.x = targetX; w.vx = 0; w.el.dataset.willStopX = "0";
      }
    } else if (w.el.dataset.willStopXY === "1") {
      const targetX = parseFloat(w.el.dataset.targetX);
      const targetY = parseFloat(w.el.dataset.targetY);
      w.x += (targetX - w.x) * 0.15;
      w.y += (targetY - w.y) * 0.15;
      if (Math.abs(targetX - w.x) < 1 && Math.abs(targetY - w.y) < 1) {
        w.x = targetX; w.y = targetY; w.el.dataset.willStopXY = "0";
      }
    } else if (w.el.dataset.followChar === "1") {
      const cw = character.offsetWidth;
      const targetX = charX + cw/2 - w.w/2 + (w.offsetIdx - 1) * (w.w + 10);
      const targetY = charY - w.h - 20;
      w.x += (targetX - w.x) * 0.12;
      w.y += (targetY - w.y) * 0.12;
    } else {
      w.x += w.vx;
      w.y += w.vy;
      if (w.mode === "toss") w.vy += 0.055;
    }
    w.el.style.left = w.x + "px";
    w.el.style.top = w.y + "px";
    const age = now - w.bornAt;
    if (age > speedCfg.lifespan && !w.el.dataset.followChar && !w.el.dataset.willStopXY) {
      try { w.el.remove(); } catch(e) {}
      if (w.isCorrect && !gameState.answered) {
        showFeedback("⏰ 漏过：" + w.text, false);
        gameState.wrongCount++;
        updateScore();
        GROWTH_API.update(false);
        handleAnswerEnd(false);
      }
      return false;
    }
    if (w.x < -400 || w.x > stageW + 400 || w.y < -400 || w.y > stageH + 400) {
      try { w.el.remove(); } catch(e) {}
      return false;
    }
    return true;
  });
  updateCharacter();
  checkCharacterCollision();
  gameState.rafId = requestAnimationFrame(gameLoop);
}

gameStage.addEventListener("mousemove", (e) => {
  const r = gameStage.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});
gameStage.addEventListener("touchmove", (e) => {
  if (!e.touches[0]) return;
  const r = gameStage.getBoundingClientRect();
  mouseX = e.touches[0].clientX - r.left;
  mouseY = e.touches[0].clientY - r.top;
}, { passive: true });

let swipeActive = false;
let swipeLast = null;
let swipePoints = [];
const sliceTrailSvg = document.getElementById("sliceTrail");
function addTrailSegment(x1, y1, x2, y2) {
  if (!sliceTrailSvg) return;
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1); line.setAttribute("y1", y1);
  line.setAttribute("x2", x2); line.setAttribute("y2", y2);
  line.setAttribute("stroke", "url(#trailGrad)");
  line.setAttribute("stroke-width", "10");
  line.setAttribute("stroke-linecap", "round");
  line.style.filter = "drop-shadow(0 0 8px rgba(255,255,255,.9)) drop-shadow(0 0 16px " + THEME_ACCENT + ")";
  sliceTrailSvg.appendChild(line);
  const start = performance.now();
  const dur = 450;
  const tick = () => {
    const t = (performance.now() - start) / dur;
    if (t >= 1) { try { line.remove(); } catch(e) {} return; }
    line.style.opacity = String(1 - t);
    line.setAttribute("stroke-width", String(10 * (1 - t * 0.6)));
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function spawnSliceFlash(x, y, isCorrect) {
  const flash = document.createElement("div");
  flash.className = "slice-flash";
  const size = 140;
  flash.style.left = (x - size/2) + "px";
  flash.style.top = (y - size/2) + "px";

  gameStage.appendChild(flash);
  flash.animate([
    { transform: "scale(.3)", opacity: 1 },

  ], { duration: 420, easing: "ease-out" });
  setTimeout(() => { try { flash.remove(); } catch(e) {} }, 450);
  const colors = isCorrect ? ["#28a96b","#78d86f","#fff06a","#35d5ee"] : ["#ef4e32","#ff7b54","#dc2626"];
  for (let i = 0; i < 14; i++) {

    drop.style.background = colors[i % colors.length];
    gameStage.appendChild(drop);
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;

    ], { duration: 700 + Math.random()*300, easing: "ease-out" });

  }
}
function spawnSliceHalves(word, angle) {
  const dirX = Math.cos(angle + Math.PI/2);
  const dirY = Math.sin(angle + Math.PI/2);
  const deg = (angle * 180 / Math.PI);
  for (let side = 0; side < 2; side++) {
    const half = document.createElement("div");
    half.className = "slice-half";
    half.textContent = word.text;
    half.style.left = word.x + "px";
    half.style.top = word.y + "px";
    half.style.width = word.w + "px";
    half.style.height = word.h + "px";
    half.style.display = "flex";
    half.style.alignItems = "center";
    half.style.justifyContent = "center";
    half.style.filter = "drop-shadow(0 0 8px rgba(255,255,255,.9))";
    const sign = side === 0 ? 1 : -1;
    half.style.clipPath = side === 0
      ? "polygon(0 0, 100% 0, 92% 58%, 8% 42%)"
      : "polygon(8% 42%, 92% 58%, 100% 100%, 0 100%)";
    half.style.transform = "rotate(" + deg + "deg) translate(0,0) scale(1)";
    half.style.transformOrigin = "center center";
    gameStage.appendChild(half);
    const burstX = dirX * sign * (95 + Math.random()*55);
    const burstY = dirY * sign * (50 + Math.random()*45);
    const fallX = burstX + sign * (35 + Math.random()*55);
    const fallY = burstY + 300 + Math.random()*120;
    const rotMid = deg + sign * (18 + Math.random()*22);
    const rotEnd = deg + sign * (95 + Math.random()*80);
    half.animate([
      { transform: "rotate(" + deg + "deg) translate(0,0) scale(1)", opacity: 1, filter: "brightness(1.3)" },
      { transform: "rotate(" + rotMid + "deg) translate(" + burstX + "px," + burstY + "px) scale(1.06)", opacity: 1, filter: "brightness(1.15)" },
      { transform: "rotate(" + rotEnd + "deg) translate(" + fallX + "px," + fallY + "px) scale(.88)", opacity: 0, filter: "brightness(.85)" }
    ], { duration: 1250, easing: "cubic-bezier(.18,.78,.32,1)" });
    setTimeout(() => { try { half.remove(); } catch(e) {} }, 1300);
  }
}
function pointLineDistance(px, py, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const x = ax + t * dx;
  const y = ay + t * dy;
  return Math.sqrt((px - x) * (px - x) + (py - y) * (py - y));
}
function segmentIntersectsRect(x1, y1, x2, y2, left, top, right, bottom) {
  const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
  const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
  if (maxX < left || minX > right || maxY < top || minY > bottom) return false;
  if ((x1 >= left && x1 <= right && y1 >= top && y1 <= bottom) || (x2 >= left && x2 <= right && y2 >= top && y2 <= bottom)) return true;
  const cross = (ax, ay, bx, by, cx, cy) => (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  const hitSeg = (ax, ay, bx, by, cx, cy, dx, dy) => {
    const c1 = cross(ax, ay, bx, by, cx, cy);
    const c2 = cross(ax, ay, bx, by, dx, dy);
    const c3 = cross(cx, cy, dx, dy, ax, ay);
    const c4 = cross(cx, cy, dx, dy, bx, by);
    return c1 * c2 <= 0 && c3 * c4 <= 0;
  };
  return hitSeg(x1,y1,x2,y2,left,top,right,top) || hitSeg(x1,y1,x2,y2,right,top,right,bottom) || hitSeg(x1,y1,x2,y2,right,bottom,left,bottom) || hitSeg(x1,y1,x2,y2,left,bottom,left,top);
}
function showCutLine(x1, y1, x2, y2, word) {
  const cx = word.x + word.w / 2;
  const cy = word.y + word.h / 2;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const len = Math.max(word.w + 90, Math.hypot(x2 - x1, y2 - y1) + 60);
  const line = document.createElement("div");
  line.className = "slice-cut-line";
  line.style.width = len + "px";
  line.style.left = (cx - len / 2) + "px";
  line.style.top = (cy - 3) + "px";
  line.style.transform = "rotate(" + angle + "rad) scaleX(.35)";
  gameStage.appendChild(line);
  line.animate([
    { transform: "rotate(" + angle + "rad) scaleX(.35)", opacity: 0.2 },
    { transform: "rotate(" + angle + "rad) scaleX(1.25)", opacity: 1 },
    { transform: "rotate(" + angle + "rad) scaleX(1.45)", opacity: 0 }
  ], { duration: 360, easing: "ease-out" });
  setTimeout(() => { try { line.remove(); } catch(e) {} }, 390);
}
function trySwipePick(x1, y1, x2, y2) {
  if (INTERACTION_MODE !== "swipe") return;
  const segLen = Math.hypot(x2 - x1, y2 - y1);
  if (segLen < 2) return;
  for (const w of gameState.flyingWords.slice()) {
    if (w.sliced) continue;
    const cx = w.x + w.w / 2;
    const cy = w.y + w.h / 2;
    const centerBand = Math.max(34, Math.min(w.w, w.h) * 0.72);
    const coreLeft = w.x + w.w * 0.18;
    const coreRight = w.x + w.w * 0.82;
    const coreTop = w.y + w.h * 0.18;
    const coreBottom = w.y + w.h * 0.82;
    const nearCenter = pointLineDistance(cx, cy, x1, y1, x2, y2) <= centerBand;
    const throughCore = segmentIntersectsRect(x1, y1, x2, y2, coreLeft, coreTop, coreRight, coreBottom);
    if (nearCenter && throughCore) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      w._sliceAngle = angle;
      showCutLine(x1, y1, x2, y2, w);
      handlePick(w);
    }
  }
}
let bladeSpark = null;
function ensureBladeSpark() {
  if (!bladeSpark) {
    bladeSpark = document.createElement("div");
    bladeSpark.className = "blade-spark";
    gameStage.appendChild(bladeSpark);
  }
  return bladeSpark;
}
function moveBladeSpark(x, y, visible) {
  if (INTERACTION_MODE !== "swipe") return;
  const spark = ensureBladeSpark();
  spark.style.left = x + "px";
  spark.style.top = y + "px";
  spark.style.opacity = visible ? "1" : "0";
  spark.style.transform = visible ? "scale(1)" : "scale(.65)";
}
function shootAt(tx, ty) {
  const cw = character.offsetWidth || 0, ch = character.offsetHeight || 0;
  const hiddenChar = !cw || !ch || getComputedStyle(character).display === "none";
  const sx = hiddenChar ? gameStage.clientWidth / 2 : charX + cw/2;
  const sy = hiddenChar ? gameStage.clientHeight - 36 : charY + ch/2;
  const bullet = document.createElement("div");
  bullet.style.cssText = "position:absolute;z-index:47;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff,#fff06a 50%," + THEME_ACCENT + ");box-shadow:0 0 12px #fff,0 0 24px " + THEME_ACCENT + ";pointer-events:none;left:" + (sx-8) + "px;top:" + (sy-8) + "px;";
  gameStage.appendChild(bullet);
  playTone(880, 0.06, "square", 0.15);
  const dx = tx - sx, dy = ty - sy;
  const dur = Math.min(600, Math.max(200, Math.hypot(dx,dy) * 1.5));
  bullet.animate([
    { transform: "translate(0,0)", opacity: 1 },
    { transform: "translate(" + dx + "px," + dy + "px)", opacity: 1 }
  ], { duration: dur, easing: "linear" });
  setTimeout(() => {
    try { bullet.remove(); } catch(e) {}
    let hit = null, best = 9999;
    for (const w of gameState.flyingWords) {
      if (w.sliced) continue;
      const wx = w.x + w.w/2, wy = w.y + w.h/2;
      const d = Math.hypot(wx - tx, wy - ty);
      if (d < 60 && d < best) { best = d; hit = w; }
    }
    if (hit) handlePick(hit);
  }, dur);
}
function setupDragWord(word) {
  word.el.style.cursor = "grab";
  let dragging = false, offX = 0, offY = 0;
  const onDown = (e) => {
    if (word.sliced) return;
    dragging = true;
    const r = gameStage.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    offX = cx - word.x; offY = cy - word.y;
    word.el.style.cursor = "grabbing";
    word.el.style.zIndex = "50";
    e.preventDefault(); e.stopPropagation();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const r = gameStage.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    word.x = cx - offX; word.y = cy - offY;
    word.vx = 0; word.vy = 0;
    word.el.dataset.willStop = "0"; word.el.dataset.willStopX = "0"; word.el.dataset.willStopXY = "0";
    word.el.style.left = word.x + "px"; word.el.style.top = word.y + "px";
    e.preventDefault();
  };
  const onUp = (e) => {
    if (!dragging) return;
    dragging = false;
    word.el.style.cursor = "grab";
    const basket = document.getElementById("dragBasket");
    if (basket) {
      const br = basket.getBoundingClientRect();
      const sr = gameStage.getBoundingClientRect();
      const bl = br.left - sr.left, bt = br.top - sr.top;
      const cx2 = word.x + word.w/2, cy2 = word.y + word.h/2;
      if (cx2 >= bl && cx2 <= bl + br.width && cy2 >= bt && cy2 <= bt + br.height) {
        handlePick(word);
      }
    }
  };
  word.el.addEventListener("mousedown", onDown);
  word.el.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("mousemove", onMove);
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("mouseup", onUp);
  window.addEventListener("touchend", onUp);
}
let connectFirst = null;
function setupConnectWord(word) {
  word.el.style.cursor = "pointer";
  word.el.addEventListener("click", (e) => {
    e.stopPropagation();
    if (word.sliced) return;
    if (!connectFirst) {
      connectFirst = word;
      word.el.style.outline = "4px solid " + THEME_ACCENT;
    } else if (connectFirst === word) {
      connectFirst.el.style.outline = "";
      connectFirst = null;
    } else {
      const a = connectFirst, b = word;
      a.el.style.outline = ""; 
      connectFirst = null;
      const line = document.createElement("div");
      const ax = a.x + a.w/2, ay = a.y + a.h/2;
      const bx = b.x + b.w/2, by = b.y + b.h/2;
      const len = Math.hypot(bx-ax, by-ay);
      const ang = Math.atan2(by-ay, bx-ax);
      line.style.cssText = "position:absolute;z-index:46;height:5px;background:linear-gradient(90deg,#fff," + THEME_ACCENT + ");box-shadow:0 0 10px " + THEME_ACCENT + ";pointer-events:none;left:" + ax + "px;top:" + (ay-2) + "px;width:" + len + "px;transform-origin:left center;transform:rotate(" + ang + "rad);";
      gameStage.appendChild(line);
      setTimeout(() => { try { line.remove(); } catch(e) {} }, 800);
      const correctOne = a.isCorrect ? a : (b.isCorrect ? b : null);
      if (correctOne) handlePick(correctOne);
      else { handlePick(a); }
    }
  });
}
gameStage.addEventListener("click", (e) => {
  if (INTERACTION_MODE === "shoot") {
    if (e.target.classList && e.target.classList.contains("flying-word")) return;
    const r = gameStage.getBoundingClientRect();
    shootAt(e.clientX - r.left, e.clientY - r.top);
    return;
  }
  if (INTERACTION_MODE === "mouseFollow") {
    const isShift = e.shiftKey || e.ctrlKey || e.metaKey;
    charJumpV = isShift ? -16 : -9;
    playTone(isShift ? 660 : 520, 0.06, "triangle", 0.15);
    if (e.target.classList && e.target.classList.contains("flying-word")) return;
  }
});
gameStage.addEventListener("pointerdown", (e) => {
  const r = gameStage.getBoundingClientRect();
  swipeActive = true;
  swipeLast = { x: e.clientX - r.left, y: e.clientY - r.top };
  swipePoints = [swipeLast];
  mouseX = swipeLast.x;
  mouseY = swipeLast.y;
  if (INTERACTION_MODE === "swipe") {
    e.preventDefault();
    moveBladeSpark(swipeLast.x, swipeLast.y, true);
    playTone(1200, 0.035, "triangle", 0.07);
  }
  try { gameStage.setPointerCapture(e.pointerId); } catch(err) {}
});
gameStage.addEventListener("pointermove", (e) => {
  const r = gameStage.getBoundingClientRect();
  const p = { x: e.clientX - r.left, y: e.clientY - r.top };
  mouseX = p.x;
  mouseY = p.y;
  if (INTERACTION_MODE === "swipe") moveBladeSpark(p.x, p.y, swipeActive);
  if (swipeActive && swipeLast) {
    const dx = p.x - swipeLast.x;
    const dy = p.y - swipeLast.y;
    if (dx*dx + dy*dy >= 4) {
      if (INTERACTION_MODE === "swipe") {
        e.preventDefault();
        addTrailSegment(swipeLast.x, swipeLast.y, p.x, p.y);
      }
      trySwipePick(swipeLast.x, swipeLast.y, p.x, p.y);
      swipeLast = p;
      swipePoints.push(p);
      if (swipePoints.length > 10) swipePoints.shift();
    }
  }
}, { passive: false });
function finishSwipe() {
  swipeActive = false;
  swipeLast = null;
  swipePoints = [];
  moveBladeSpark(mouseX, mouseY, false);
}
window.addEventListener("pointerup", finishSwipe);
window.addEventListener("pointercancel", finishSwipe);

function setupDynamicBg() {
  if (!DYNAMIC_BG) return;
  const cvs = document.getElementById("dynamicBgCanvas");
  if (!cvs) return;
  const fit = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
  fit();
  window.addEventListener("resize", fit);
  const ctx = cvs.getContext("2d");
  const parts = [];
  for (let i = 0; i < 40; i++) {
    parts.push({
      x: Math.random() * cvs.width,
      y: Math.random() * cvs.height,
      r: 2 + Math.random() * 4,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -0.2 - Math.random() * 0.8,
      a: 0.3 + Math.random() * 0.4
    });
  }
  const tick = () => {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = cvs.height + 10; p.x = Math.random() * cvs.width; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255," + p.a + ")";
      ctx.fill();
    });
    requestAnimationFrame(tick);
  };
  tick();
}

function startGame() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  gameState.current = 0;
  gameState.score = 0;
  gameState.correctCount = 0;
  gameState.wrongCount = 0;
  gameState.results = [];
  gameState.growthLevel = 0;
  GROWTH_API.reset();
  updateScore();
  initCharacter();
  loadQuestion();
  if (!gameState.rafId) gameLoop();
  if (BGM_STRATEGY !== "off") { gameState.bgmOn = true; startBgm(); }
}

function endGame() {
  if (gameState.rafId) { cancelAnimationFrame(gameState.rafId); gameState.rafId = null; }
  gameState.flyingWords.forEach(w => { try { w.el.remove(); } catch(e) {} });
  gameState.flyingWords = [];
  const acc = Math.round((gameState.correctCount / Math.max(1, QUESTIONS.length)) * 100);
  document.getElementById("finalScore").textContent = gameState.score;
  document.getElementById("finalAcc").textContent = acc + "%";
  let stars = 1;
  if (gameState.correctCount === QUESTIONS.length) stars = 3;
  else if (gameState.correctCount >= QUESTIONS.length - 1) stars = 2;
  const starsRow = document.getElementById("starsRow");
  starsRow.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const s = document.createElement("span");
    s.textContent = i < stars ? "⭐" : "☆";
    starsRow.appendChild(s);
  }
  document.getElementById("endScreen").classList.remove("hidden");
  if (END_FX === "fanfare") {
    playTone(523, 0.15, "square", 0.2);
    setTimeout(() => playTone(659, 0.15, "square", 0.2), 150);
    setTimeout(() => playTone(784, 0.3, "square", 0.2), 300);
  } else if (END_FX === "chime") {
    playTone(1047, 0.2, "sine", 0.15);
    setTimeout(() => playTone(1318, 0.3, "sine", 0.15), 200);
  }
  stopBgm();
}

const btnStart = document.getElementById("btnStart");
if (btnStart) btnStart.addEventListener("click", startGame);
document.getElementById("btnReplay").addEventListener("click", startGame);
document.getElementById("btnAgain").addEventListener("click", startGame);
document.getElementById("btnSound").addEventListener("click", (e) => {
  gameState.soundOn = !gameState.soundOn;
  e.currentTarget.textContent = gameState.soundOn ? "🔊 音效" : "🔇 静音";
});
document.getElementById("btnBgm").addEventListener("click", (e) => {
  gameState.bgmOn = !gameState.bgmOn;
  e.currentTarget.textContent = gameState.bgmOn ? "🎵 BGM" : "🔕 关";
  if (gameState.bgmOn) startBgm(); else stopBgm();
});
document.getElementById("bgmVolume").addEventListener("input", (e) => {
  setBgmVolume(parseInt(e.target.value) / 100);
});

window.addEventListener("load", () => {
  setupDynamicBg();
  setTimeout(() => {
    initCharacter();
    if (OPENING_GUIDE === "off") startGame();
    if (BGM_STRATEGY === "auto" && OPENING_GUIDE === "off") { gameState.bgmOn = true; startBgm(); }
  }, 100);
});
