<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词消消乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fffacd, #f0e68c);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .title {
            font-size: 2.5rem;
            color: #ff6b35;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .game-container {
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: 40px 0;
            padding: 20px;
            align-items: center;
        }

        .en-bubble {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            user-select: none;
        }

        .option-wrap {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        .bubble {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            position: relative;
            user-select: none;
        }

        .bubble:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        /* 爆炸动画 */
        @keyframes boom {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.6; background: red; }
            100% { transform: scale(0); opacity: 0; }
        }
        .boom {
            animation: boom 0.5s forwards;
        }

        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .success-content {
            background: linear-gradient(135deg, #fffacd, #f0e68c);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 3px solid #ff6b35;
            max-width: 90%;
            width: 400px;
        }

        .success-title {
            font-size: 2rem;
            color: #ff6b35;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .continue-btn {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        /* 答错gif弹窗 */
        /* 答错GIF弹窗 修复版 */
.error-gif {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    z-index: 10000; /* 最高层级 */
    display: none;
    pointer-events: none;
}
    </style>
</head>
<body>
    <h1 class="title">🎮 单词消消乐 🎮</h1>
    <div class="game-info">
        <div>⏰ 用时: <span id="timer">00:00</span></div>
        <div>🎯 剩余: <span id="progress">0</span></div>
    </div>

    <div class="game-container">
        <div class="en-bubble" id="enWord"></div>
        <div class="option-wrap" id="optionBox"></div>
    </div>

    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-title">🎉 全部通关！</div>
            <button class="continue-btn" onclick="resetAll()">重新开始</button>
        </div>
    </div>

    <audio id="bgMusic" src="jcldxt.mp3" loop />
    <audio id="boomSound" src="error.m4a" />
    <audio id="winSound" src="end.m4a" />
    <audio id="okSound" src="ok.mp3" />
    <audio id="ok1" src="ok1.m4a" />
    <audio id="ok2" src="ok2.m4a" />
    <audio id="ok3" src="ok3.m4a" />

    <img class="error-gif" id="errorGif" src="" />

    <script>
        // 单词直接写这里，不用外部json，双击可直接打开
        const allWords = [
{"en":"outstanding","zh":"优秀的；杰出的","err":"普通的；平庸的"},
{"en":"old‑fashioned","zh":"陈旧的；过时的","err":"新潮的；时髦的"},
{"en":"classical","zh":"古典的；经典的","err":"现代的；新潮的"},
{"en":"ordinary","zh":"普通的；平凡的","err":"非凡的；卓越的"},
{"en":"lamp","zh":"灯","err":"锁"},
{"en":"poet","zh":"诗人","err":"画家"},
{"en":"convinced","zh":"坚信的；确信的","err":"怀疑的；疑惑的"},
{"en":"philosopher","zh":"哲学家","err":"音乐家"},
{"en":"dramatist","zh":"剧作家","err":"运动员"},
{"en":"judgement","zh":"看法；意见；评价","err":"礼物；奖品"},
{"en":"evaluation","zh":"评价；评估","err":"想象；幻想"},
{"en":"consider","zh":"认为；觉得","err":"否认；拒绝"},
{"en":"background","zh":"背景","err":"前景"},
{"en":"significant","zh":"有重大意义的；显著的","err":"无关紧要的；微小的"},
{"en":"milestone","zh":"重要事件；里程碑","err":"小插曲；琐事"},
{"en":"manage","zh":"完成（困难的事）","err":"搞砸；失败"},
{"en":"impact","zh":"巨大影响；强大作用","err":"微弱的效果"},
{"en":"truth","zh":"真理","err":"谎言"},
{"en":"concentrated","zh":"全神贯注的；全力以赴的","err":"心不在焉的；散漫的"},
{"en":"belief","zh":"相信","err":"怀疑"},
{"en":"with something in mind","zh":"考虑到……","err":"无视……"},
{"en":"in addition to","zh":"除……之外","err":"仅限于……"},
{"en":"be fond of","zh":"喜爱","err":"厌恶；讨厌"},
{"en":"reach for","zh":"伸手去拿","err":"推开；远离"},
{"en":"firm","zh":"牢固的；坚硬的","err":"松软的；柔弱的"},
{"en":"ignorance","zh":"无知","err":"博学；学识"},
{"en":"application","zh":"（尤指理论、发现等的）应用","err":"理论；空想"},
{"en":"fancy","zh":"精致的；绚丽的","err":"简陋的；朴素的"},
{"en":"satisfied","zh":"满意的；满足的","err":"不满的；失望的"},
{"en":"prince","zh":"王子","err":"公主"},
{"en":"displace","zh":"排出；挤出；取代；替代","err":"保留；留存"},
{"en":"fool","zh":"欺骗；愚弄","err":"信任；相信"},
{"en":"prison","zh":"监狱；牢狱","err":"宫殿"},
{"en":"wire","zh":"金属丝；电线","err":"布条；棉线"},
{"en":"prove","zh":"证明；证实","err":"反驳；推翻"},
{"en":"hardly","zh":"几乎不；几乎没有","err":"完全；全部"},
{"en":"balanced","zh":"保持（或显示）平衡的","err":"失衡的；倾斜的"},
{"en":"reject","zh":"拒绝接受；不予考虑","err":"接纳；接受"},
{"en":"thus","zh":"因此；如此","err":"然而；但是"},
{"en":"be satisfied with","zh":"对……感到满足","err":"对……感到不满"},
{"en":"fill…with","zh":"充满；装满","err":"清空；倒空"},
{"en":"run over","zh":"溢出","err":"吸收；收纳"},
{"en":"go straight to","zh":"直奔","err":"绕道去往"},
{"en":"lightning rod","zh":"避雷针","err":"天线"},
{"en":"as a whole","zh":"作为一个整体；总体上","err":"局部来看；就部分而言"},
{"en":"get something across","zh":"把某事讲清楚","err":"把某事隐瞒起来"},
{"en":"indeed","zh":"确实（强调肯定的陈述或答复）","err":"未必；不见得"},
{"en":"match","zh":"火柴","err":"蜡烛"},
{"en":"shame","zh":"令人惋惜的事；让人遗憾的事","err":"值得庆幸的事"},
{"en":"remove","zh":"去掉","err":"保留；留存"},
{"en":"lower","zh":"把……放低","err":"抬高；举起"},
{"en":"practice","zh":"实践；实际行动","err":"空想；理论"},
{"en":"decision","zh":"决定","err":"犹豫；迟疑"},
{"en":"cheat","zh":"欺骗；蒙骗","err":"坦诚；如实告知"},
{"en":"strengthen","zh":"加强；增强；巩固","err":"削弱；减弱"},
{"en":"fold","zh":"折叠","err":"展开；摊开"},
{"en":"repetition","zh":"重复","err":"创新；革新"},
{"en":"pardon","zh":"（用于请求别人重复某事）请再说一遍","err":"请安静"},
{"en":"vacation","zh":"假期","err":"工作日"},
{"en":"somehow","zh":"不知为什么","err":"毫无疑问地"},
{"en":"awkward","zh":"令人尴尬的","err":"得体大方的"},
{"en":"laughter","zh":"笑；笑声","err":"哭泣；哭声"},
{"en":"tear","zh":"眼泪","err":"汗水"},
{"en":"with admiration","zh":"钦佩地；赞赏地","err":"鄙夷地；轻视地"},
{"en":"right and wrong","zh":"是非","err":"真假"},
{"en":"fresh in one's memory","zh":"记忆犹新","err":"早已遗忘"},
{"en":"bed sheet","zh":"床单","err":"枕套"}
];

        let passedWords = [];
        let gameWords = [];
        let currentWord = null;
        let startTime;
        let timerInterval;
        let successCount = 0; // 累计答对次数
        let audioIndex = 0;    // 顺序索引 0=ok1,1=ok2,2=ok3
        let gifIndex = 0; // 控制error1/2/3顺序

        function initGame() {
            // 读取已通关（浏览器本地存储，替代 passed.json）
            passedWords = JSON.parse(localStorage.getItem("passed") || "[]");
            gameWords = allWords.filter(w => !passedWords.includes(w.en));
            startGame();
        }

        function startGame() {
            updateInfo();
            nextWord();
            startTimer();
        }

        function nextWord() {
            if(gameWords.length === 0) {
                gameComplete();
                return;
            }
            const i = Math.floor(Math.random() * gameWords.length);
            currentWord = gameWords[i];
            showWord();
        }

        function showWord() {
            document.getElementById("enWord").textContent = currentWord.en;
            const opts = [
                {txt:currentWord.zh, right:true},
                {txt:currentWord.err, right:false}
            ].sort(()=>Math.random()-0.5);

            const box = document.getElementById("optionBox");
            box.innerHTML = "";
            opts.forEach(o => {
                const d = document.createElement("div");
                d.className = "bubble";
                d.style.background = getColor();
                d.textContent = o.txt;
                d.onclick = () => choose(o.right, d);
                box.appendChild(d);
            });
        }

        function choose(isRight, dom) {
            if(isRight) {
	successCount++;
                 // 每3次随机播放ok1/ok2/ok3
                 if (successCount % 3 === 0) {
                     // 每3次按顺序播放
            	    const list = ["ok1","ok2","ok3"];
            	    const audio = document.getElementById(list[audioIndex]);
            	    audio.currentTime = 0;
            	    audio.play().catch(()=>{});
            	    // 索引循环
            	    audioIndex = (audioIndex + 1) % 3;
                 } else {
                     // 普通答对音效
                     const okAudio = document.getElementById("okSound");
                     okAudio.currentTime = 0;
                     okAudio.play().catch(()=>{});
                 }

                // 答对：保存，移除题库
                passedWords.push(currentWord.en);
                localStorage.setItem("passed", JSON.stringify(passedWords));
                gameWords = gameWords.filter(w => w.en !== currentWord.en);
                setTimeout(nextWord, 400);
            } else {
                // 答错：动态创建GIF弹窗，强制居中、最高层级
        	const gifList = ["error1.gif","error2.gif","error3.gif"];

        	// 移除旧的
        	let oldGif = document.getElementById("tempErrorGif");
        	if(oldGif) oldGif.remove();

        	// 新建
        	let div = document.createElement("div");
        	div.id = "tempErrorGif";
        	div.style.cssText = `
           	 	position:fixed;
            		top:50%;left:50%;
            		transform:translate(-50%,-50%);
            		z-index:999999;
            		width:220px;height:220px;
            		background:url(${gifList[gifIndex]}) center/cover no-repeat;
        	`;
        	document.body.appendChild(div);

       	 // 循环索引
        	gifIndex = (gifIndex + 1) % 3;

       	 // 1.5秒后消失
        	setTimeout(()=>{
            		div.remove();
        	}, 1500);

                // 答错：爆炸动画+音效，题目保留
                dom.classList.add("boom");
	document.getElementById("boomSound").currentTime = 0; // 重置到开头
                document.getElementById("boomSound").play().catch(()=>{});
                setTimeout(() => {
                    dom.classList.remove("boom");
                    nextWord();
                }, 1500);
            }
            updateInfo();
        }

        function getColor() {
            const cs = ['#4ecdc4','#45b7d1','#f093fb','#4facfe','#43e97b','#fa709a'];
            return cs[Math.floor(Math.random()*cs.length)];
        }

        function updateInfo() {
            document.getElementById("progress").textContent = gameWords.length;
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const s = Math.floor((Date.now()-startTime)/1000);
                document.getElementById("timer").textContent = 
                    String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0');
            },1000);
        }

        function gameComplete() {
            clearInterval(timerInterval);
            // 播放通关音效
            document.getElementById("winSound").play().catch(()=>{});
            document.getElementById("successModal").style.display = "flex";
        }

        function resetAll() {
            localStorage.removeItem("passed");
            location.reload();
        }

        window.onload = () => {
            initGame();
            // 背景音乐自动播放兼容
            const bg = document.getElementById("bgMusic");
            //bg.play().catch(()=>{
             //   document.body.onclick = ()=>bg.play();
            //});
        };
    </script>
</body>
</html>
